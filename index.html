<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b4332" />
  <title>Sabah Malaria Control - House Locator</title>

  <!-- Relative path works cleanly on GitHub Pages subpaths -->
  <link rel="manifest" href="./manifest.json" />

  <style>
    /* =========================================================
       1. COLOR VARIABLES & BASE LAYOUT (Safe to customize)
       ========================================================= */
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --accent: #2b6cb0;
      --warning: #dd6b20;
      --danger: #c53030;
      --purple: #6b46c1;
      --bg: #f4f6f8;
      --border: #d9e2ec;
      --text: #102a43;
      --muted: #52606d;
      --header-h: 54px;
      --nav-h: 60px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================================================
       2. TOP HEADER BAR
       ========================================================= */
    header {
      height: var(--header-h);
      background: var(--primary);
      color: #ffffff;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    header small {
      display: block;
      font-size: 0.72rem;
      opacity: 0.85;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      background: #2f855a;
      color: #ffffff;
      white-space: nowrap;
    }

    .status-pill.offline {
      background: var(--warning);
    }

    /* =========================================================
       3. WORKSPACE (Side-by-Side on Desktop, Tabbed on Mobile)
       ========================================================= */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #sidebar {
      width: 390px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #map-container {
      flex: 1;
      position: relative;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-offline-bar {
      position: absolute;
      bottom: 16px;
      left: 12px;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 240px;
    }

    .btn-offline-cache {
      background: rgba(27, 67, 50, 0.94);
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      width: auto;
      margin: 0;
    }

    .cache-status {
      background: rgba(255, 255, 255, 0.94);
      color: var(--text);
      font-size: 0.74rem;
      padding: 5px 8px;
      border-radius: 6px;
      display: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* =========================================================
       4. CARDS, INPUTS & BUTTONS
       ========================================================= */
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .card h2 {
      margin: 0 0 6px 0;
      font-size: 1rem;
      color: var(--text);
    }

    .helper-text {
      margin: 0 0 8px 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 10px;
      color: #334e68;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button {
      background: var(--primary-light);
      color: #ffffff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      opacity: 0.85;
    }

    .btn-gps { background: var(--accent); }
    .btn-export { background: var(--warning); }
    .btn-import { background: var(--purple); }
    .btn-cancel { background: #627d98; }
    .btn-small {
      width: auto;
      padding: 5px 10px;
      font-size: 0.76rem;
      margin-top: 6px;
    }

    .two-col {
      display: flex;
      gap: 8px;
    }

    .two-col > div {
      flex: 1;
    }
